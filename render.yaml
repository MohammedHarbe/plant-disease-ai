# Optional backend-only Render blueprint.
# The frontend is configured for Vercel in frontend/plantai/plantai/vercel.json.
services:
  - type: web
    name: plantai-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
